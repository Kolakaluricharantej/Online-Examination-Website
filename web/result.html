<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Examination - Result</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="result-container">
        <div class="result-card">
            <div class="logo">EXAM<span>PRO</span></div>
            <h1>Examination Result</h1>
            <p id="resultMessage"></p>

            <div class="score-circle">
                <strong id="score">0/10</strong>
                <span id="percentage">0%</span>
            </div>

            <div class="result-grid">
                <div><span>Student</span><b id="resultStudent">-</b></div>
                <div><span>Correct Answers</span><b id="correct">0</b></div>
                <div><span>Wrong Answers</span><b id="wrong">0</b></div>
                <div><span>Unanswered</span><b id="unanswered">0</b></div>
            </div>

            <div id="answerReview" class="answer-review"></div>

            <button class="primary-btn" onclick="window.location.href='index.html'">
                Take Exam Again
            </button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
